name: Moodle Plugin CI

on: [pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------------------------------
  # Fast pre-checks — run on every push in ~60 s, no Moodle install needed.
  # Gates the expensive matrix job.
  # -----------------------------------------------------------------------
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: PHP syntax check (all files)
        run: |
          ERROR=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || ERROR=1
          done < <(find . -name "*.php" ! -path "*/vendor/*" ! -path "*/.git/*" -print0)
          exit $ERROR

      - name: Validate AMD build files are present
        run: |
          ERROR=0
          for src in amd/src/*.js; do
            base=$(basename "$src" .js)
            if [ ! -f "amd/build/${base}.min.js" ]; then
              echo "::error file=$src::Missing AMD build file: amd/build/${base}.min.js"
              ERROR=1
            fi
          done
          [ $ERROR -eq 0 ] && echo "All AMD build files present." || exit 1

      - name: Validate JSON files
        run: |
          ERROR=0
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Invalid JSON: $file"
              ERROR=1
            fi
          done < <(find . -name "*.json" ! -path "*/vendor/*" ! -path "*/.git/*" ! -path "*/amd/build/*" -print0)
          [ $ERROR -eq 0 ] && echo "All JSON files valid." || exit 1

      - name: Check version.php declares required fields
        run: |
          php -r "
          define('MOODLE_INTERNAL', true);
          define('MATURITY_STABLE', 200);
          define('MATURITY_RC', 150);
          define('MATURITY_BETA', 100);
          define('MATURITY_ALPHA', 50);
          \$plugin = new stdClass();
          require 'version.php';
          \$ok = true;
          if (empty(\$plugin->version))  { echo \"::error::version.php missing \\\$plugin->version\n\";  \$ok = false; }
          if (empty(\$plugin->requires)) { echo \"::error::version.php missing \\\$plugin->requires\n\"; \$ok = false; }
          if (empty(\$plugin->component)){ echo \"::error::version.php missing \\\$plugin->component\n\";\$ok = false; }
          exit(\$ok ? 0 : 1);
          "

  # -----------------------------------------------------------------------
  # Full Moodle test matrix — only runs when lint passes.
  # -----------------------------------------------------------------------
  test:
    name: Test (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-22.04
    needs: lint

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: "root"
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2"]
        moodle-branch: ["MOODLE_405_STABLE"]
        database: [mariadb]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

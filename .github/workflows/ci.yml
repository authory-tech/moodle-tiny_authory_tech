name: Moodle Plugin CI

on:
  pull_request: {}
  push:
    branches: [main, develop]
  workflow_dispatch: {}

# A push to a branch that also has an open PR fires both `push` and `pull_request`
# for the same commit. `github.ref` differs between the two events for the same
# branch (refs/heads/x vs refs/pull/N/merge), so it wouldn't unify them — the
# head branch name (head_ref for pull_request, ref_name for push) does.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -----------------------------------------------------------------------
  # Fast pre-checks — run on every push in ~60 s, no Moodle install needed.
  # Gates the expensive matrix job.
  # -----------------------------------------------------------------------
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: PHP syntax check (all files)
        run: |
          ERROR=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || ERROR=1
          done < <(find . -name "*.php" ! -path "*/vendor/*" ! -path "*/.git/*" -print0)
          exit $ERROR

      - name: Validate AMD build files are present
        run: |
          ERROR=0
          for src in amd/src/*.js; do
            base=$(basename "$src" .js)
            if [ ! -f "amd/build/${base}.min.js" ]; then
              echo "::error file=$src::Missing AMD build file: amd/build/${base}.min.js"
              ERROR=1
            fi
          done
          [ $ERROR -eq 0 ] && echo "All AMD build files present." || exit 1

      - name: Validate JSON files
        run: |
          ERROR=0
          while IFS= read -r -d '' file; do
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Invalid JSON: $file"
              ERROR=1
            fi
          done < <(find . -name "*.json" ! -path "*/vendor/*" ! -path "*/.git/*" ! -path "*/amd/build/*" -print0)
          [ $ERROR -eq 0 ] && echo "All JSON files valid." || exit 1

      - name: Check version.php declares required fields
        run: |
          php -r "
          define('MOODLE_INTERNAL', true);
          define('MATURITY_STABLE', 200);
          define('MATURITY_RC', 150);
          define('MATURITY_BETA', 100);
          define('MATURITY_ALPHA', 50);
          \$plugin = new stdClass();
          require 'version.php';
          \$ok = true;
          if (empty(\$plugin->version))  { echo \"::error::version.php missing \\\$plugin->version\n\";  \$ok = false; }
          if (empty(\$plugin->requires)) { echo \"::error::version.php missing \\\$plugin->requires\n\"; \$ok = false; }
          if (empty(\$plugin->component)){ echo \"::error::version.php missing \\\$plugin->component\n\";\$ok = false; }
          exit(\$ok ? 0 : 1);
          "

  # -----------------------------------------------------------------------
  # Full, exhaustive Moodle test matrix — runs on every PR and on every push
  # to main/develop, once lint passes. There is no separate lighter/heavier
  # split: this is the only test job, and it always runs the full matrix.
  # -----------------------------------------------------------------------
  test:
    name: Test (PHP ${{ matrix.php }}, ${{ matrix.database }}, ${{ matrix.moodle-branch }})
    runs-on: ubuntu-22.04
    needs: lint
    # Moodle 5.x support is still being verified — don't let a known 5.x-only
    # gap block merges while 4.5 (the officially supported branch) stays a hard gate.
    continue-on-error: ${{ matrix.moodle-branch != 'MOODLE_405_STABLE' }}

    services:
      # Postgres 16 is Moodle 5.2's minimum (per moodle-plugin-ci's changelog); newer-than-minimum
      # is always safe for the older 4.5 leg too, so this is bumped globally rather than per-branch.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: "root"
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
        moodle-branch: ["MOODLE_405_STABLE", "MOODLE_502_STABLE"]
        database: [mariadb, pgsql]
        # Moodle 5.2 requires PHP >=8.3 (composer.json); 8.1/8.2 fail at Moodle's own
        # `composer install` before any of our checks even run — not a real gap to test.
        exclude:
          - php: "8.1"
            moodle-branch: "MOODLE_502_STABLE"
          - php: "8.2"
            moodle-branch: "MOODLE_502_STABLE"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      # PHPStan isn't bundled with moodle-plugin-ci, so it's installed standalone here.
      # micaherne/phpstan-moodle bootstraps Moodle's classloader so plugin code that
      # references core classes/aliases resolves correctly; it needs a real Moodle
      # checkout with `composer install` already run there, which moodle-plugin-ci's
      # install step (above) provides via ci/.env's MOODLE_DIR.
      - name: Load Moodle install path
        if: ${{ !cancelled() }}
        run: cat ci/.env >> "$GITHUB_ENV"

      - name: Install PHPStan (Moodle-aware)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p phpstan-tools
          cd phpstan-tools
          composer init -n -q \
            --require=phpstan/phpstan:^2.1 \
            --require=micaherne/phpstan-moodle:^1.1 \
            --require=phpstan/extension-installer:^1.4
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer install --no-interaction -q

      - name: PHPStan static analysis
        if: ${{ !cancelled() }}
        run: |
          # Moodle 5.1+ moves the real docroot (dirroot) to $MOODLE_DIR/public; the
          # bootstrap must scan that, not the outer checkout, or file-based requires
          # computed from $CFG->dirroot resolve to paths phpstan-moodle never scanned.
          if [ -d "${MOODLE_DIR}/public" ]; then
            MOODLE_ROOT="${MOODLE_DIR}/public"
          else
            MOODLE_ROOT="${MOODLE_DIR}"
          fi
          sed "s#__MOODLE_ROOT__#${MOODLE_ROOT}#" plugin/phpstan.neon.dist > plugin/phpstan.neon
          php -d memory_limit=1G phpstan-tools/vendor/bin/phpstan analyse -c plugin/phpstan.neon --no-progress

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

                  page: 0
                  courseid: 5
      responses:
        '200':
          description: JSON-encoded list of course modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MoodleResponse'

  /service.php#authory_tech_store_user_writing:
    post:
      operationId: authory_tech_store_user_writing
      summary: Store user writing statistics
      description: |
        Stores aggregate writing statistics for a user's session (KPM, WPM, character count, etc.)
        into the `tiny_authory_tech_user_writing` table.
      tags: [Writing Storage]
      x-moodle-capability: tiny/authory_tech:write
      x-moodle-type: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_store_user_writing
                args:
                  personid: 42
                  fileid: 101
                  charactercount: 1500
                  totaltimeseconds: 600
                  charactersperminute: 150
                  keycount: 1800
                  keysperminute: 180
                  wordcount: 280
                  wordsperminute: 28
                  backspacepercent: 0.05
                  copybehavior: 0.0
                  score: 0.87
                  qualityaccess: 1
      responses:
        '200':
          description: Status and message
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MoodleResponse'
                    - type: object
                      properties:
                        data:
                          $ref: '#/components/schemas/StatusMessage'

  /service.php#authory_tech_write_local_to_json:
    post:
      operationId: authory_tech_write_local_to_json
      summary: Write keystroke JSON data to the database
      description: |
        Saves a batch of keystroke events (from the browser's local storage) to the
        `tiny_authory_tech_files` table. Returns the resulting filename.
      tags: [Writing Storage]
      x-moodle-capability: tiny/authory_tech:view
      x-moodle-type: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_write_local_to_json
                args:
                  resourceid: 55
                  key: "a"
                  keycode: 65
                  event: "keydown"
                  cmid: 12
                  modulename: "assign"
                  editorid: "id_introeditor"
                  jsondata: "[{\"k\":\"a\",\"t\":1234567890}]"
                  originaltext: "Initial draft text"
      responses:
        '200':
          description: Filename of the stored JSON file
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MoodleResponse'

  /service.php#authory_tech_get_reply_json:
    post:
      operationId: authory_tech_get_reply_json
      summary: Retrieve stored keystroke JSON file
      description: Returns the raw keystroke data, comments, and original text for a given file path.
      tags: [Writing Analytics]
      x-moodle-capability: tiny/authory_tech:view
      x-moodle-type: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_get_reply_json
                args:
                  filepath: "authory_tech/101_42_assign.json"
      responses:
        '200':
          description: Keystroke replay data
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MoodleResponse'
                    - type: object
                      properties:
                        data:
                          type: object
                          properties:
                            status:
                              type: boolean
                            data:
                              type: string
                              description: JSON-encoded keystroke events
                            comments:
                              type: string
                              description: JSON-encoded comments
                            original:
                              type: string
                              description: Original text at session start


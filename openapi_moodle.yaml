  /service.php#authory_tech_get_config:
    post:
      operationId: authory_tech_get_config
      summary: Get plugin configuration for a course/module
      description: |
        Returns plugin configuration state including sync interval, API key status, module
        enabled state, rubric settings, paste policy, and quiz/assignment submission info.
      tags: [Configuration]
      x-moodle-capability: tiny/authory_tech:writingreport
      x-moodle-type: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_get_config
                args:
                  courseid: 5
                  cmid: 12
      responses:
        '200':
          description: Plugin configuration object
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MoodleResponse'
                    - type: object
                      properties:
                        data:
                          type: object
                          properties:
                            status:
                              type: boolean
                            sync_interval:
                              type: integer
                              description: Autosave interval in seconds
                            userid:
                              type: integer
                            apikey_status:
                              type: boolean
                              description: Whether a valid API key is configured
                            mod_state:
                              type: boolean
                              description: Whether the plugin is enabled for this module
                            plugins:
                              type: string
                              description: JSON-encoded list of enabled plugin modules
                            rubrics:
                              type: string
                              description: JSON-encoded rubric settings
                            submission:
                              type: string
                              description: JSON-encoded submission data
                            quizinfo:
                              type: string
                              description: JSON-encoded quiz metadata (if applicable)
                            pastesetting:
                              type: string
                              description: JSON-encoded paste detection policy

  /service.php#authory_tech_generate_webtoken:
    post:
      operationId: authory_tech_generate_webtoken
      summary: Generate a webservice token
      description: Generates a Moodle webservice token for the current user to authenticate subsequent API calls.
      tags: [Tokens]
      x-moodle-capability: tiny/authory_tech:view
      x-moodle-type: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_generate_webtoken
                args: {}
      responses:
        '200':
          description: Generated token
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MoodleResponse'
                    - type: object
                      properties:
                        data:
                          type: object
                          properties:
                            token:
                              type: string

  /service.php#authory_tech_approve_token:

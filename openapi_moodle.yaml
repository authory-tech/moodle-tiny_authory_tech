openapi: 3.0.3
info:
  title: Authory.tech — Moodle Web Services API
  description: |
    Web service functions exposed by the `tiny_authory_tech` TinyMCE plugin.

    All functions are dispatched through Moodle's AJAX endpoint:
    ```
    POST {moodle_root}/lib/ajax/service.php
    ```
    Each request body is a JSON array of function call objects:
    ```json
    [
      {
        "index": 0,
        "methodname": "authory_tech_get_user_list",
        "args": { "page": 0, "courseid": 5 }
      }
    ]
    ```
    Responses are a JSON array indexed by `index`. Authentication uses
    Moodle's session cookie or a webservice token via the `wstoken` query parameter.

    **Capabilities:**
    - `tiny/authory_tech:view` — read-only access (teachers, admins)
    - `tiny/authory_tech:write` — write access (students recording keystrokes)
    - `tiny/authory_tech:writingreport` — access writing reports
    - `tiny/authory_tech:editsettings` — admin/plugin settings

    See also: `openapi_ml_server.yaml` for the Authory.tech backend API.
  version: "1.0.0"
  contact:
    name: SEPTUM QA
    email: info@authory.tech

servers:
  - url: "{moodle_root}/lib/ajax"
    description: Moodle AJAX dispatcher
    variables:
      moodle_root:
        default: "https://your-moodle-site.com"

tags:
  - name: Users
    description: User listing and submission statistics
  - name: Modules
    description: Course module listing
  - name: Writing Storage
    description: Storing keystroke data and writing sessions
  - name: Writing Analytics
    description: Retrieving writing statistics and analytics
  - name: Writing Differences
    description: Storing and retrieving text diffs between reconstructed and submitted text
  - name: Comments
    description: User comments on submissions
  - name: Configuration
    description: Plugin configuration per course/module
  - name: Tokens
    description: Token generation and approval
  - name: Activity Modules
    description: Activity-specific data (lesson, oublog)
  - name: Admin
    description: Administrative functions

paths:
  /service.php#authory_tech_get_user_list:
    post:
      operationId: authory_tech_get_user_list
      summary: Get list of users in a course
      description: Returns a JSON-encoded list of users enrolled in a given course.
      tags: [Users]
      x-moodle-capability: tiny/authory_tech:view
      x-moodle-type: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_get_user_list
                args:
                  page: 0
                  courseid: 5
      responses:
        '200':
          description: JSON-encoded list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MoodleResponse'
              example:
                - index: 0
                  error: false
                  data: "[{\"id\":1,\"fullname\":\"John Doe\"}]"

  /service.php#authory_tech_get_module_list:
    post:
      operationId: authory_tech_get_module_list
      summary: Get list of course modules
      description: Returns a JSON-encoded list of activity modules (quiz, assign, forum, etc.) in a course.
      tags: [Modules]
      x-moodle-capability: tiny/authory_tech:view
      x-moodle-type: read
      requestBody:
        required: true
        content:
          application/json:

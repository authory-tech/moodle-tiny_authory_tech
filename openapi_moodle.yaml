                items:
                  $ref: '#/components/schemas/MoodleResponse'

  /service.php#authory_tech_disable_all_course:
    post:
      operationId: authory_tech_disable_all_course
      summary: Disable plugin for all courses
      description: Globally disables the authory_tech plugin across all courses. Admin-only operation.
      tags: [Admin]
      x-moodle-capability: tiny/authory_tech:view
      x-moodle-type: read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_disable_all_course
                args:
                  disable: true
      responses:
        '200':
          description: Boolean success indicator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MoodleResponse'

components:
  schemas:
    MoodleRequest:
      type: array
      description: Moodle AJAX request envelope. Each element is one function call.
      items:
        type: object
        required: [index, methodname, args]
        properties:
          index:
            type: integer
            description: Zero-based index used to match responses
          methodname:
            type: string
            description: The web service function name (e.g. `authory_tech_get_user_list`)
          args:
            type: object
            description: Function arguments (varies per function)

    MoodleResponse:
      type: object
      description: Single function call response within the Moodle AJAX response array
      properties:
        index:
          type: integer
          description: Matches the request index
        error:
          type: boolean
          description: True if the call failed
        data:
          description: Return value — type depends on the function (string, boolean, or object)
        exception:
          type: object
          description: Present only when error is true
          properties:
            message:
              type: string
            errorcode:
              type: string
            debuginfo:
              type: string

    StatusMessage:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Writing stored successfully"

  securitySchemes:
    MoodleSession:
      type: apiKey
      in: cookie
      name: MoodleSession
      description: Standard Moodle session cookie (used when calling from within Moodle)
    WebserviceToken:
      type: apiKey
      in: query
      name: wstoken
      description: Moodle webservice token (use `authory_tech_generate_webtoken` to obtain one)

security:
  - MoodleSession: []
  - WebserviceToken: []

  /service.php#authory_tech_store_writing_differences:
    post:
      operationId: authory_tech_store_writing_differences
      summary: Store writing differences
      description: |
        Stores the diff between the text reconstructed from keystrokes and the final submitted
        text into the `tiny_authory_tech_writing_diff` table.
      tags: [Writing Differences]
      x-moodle-capability: tiny/authory_tech:write
      x-moodle-type: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleRequest'
            example:
              - index: 0
                methodname: authory_tech_store_writing_differences
                args:
                  fileid: 101
                  reconstructedtext: "The reconstructed text from keystrokes"
                  submittedtext: "The final submitted text"
                  meta: "{\"similarity\":0.92}"
      responses:
        '200':
          description: Status and message
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/MoodleResponse'
                    - type: object
                      properties:
                        data:
                          $ref: '#/components/schemas/StatusMessage'

  /service.php#authory_tech_get_writing_differences:
